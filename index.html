document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

erif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"7c841e52-6d7d-4cc4-8076-43e7bbd1ffc1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  html { scroll-behavior: smooth; }\n  body { margin: 0; background: #FFFFFF; color: #1A1A22; font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }\n  a { color: #1C4C96; text-decoration: none; }\n  a:hover { color: #534AB7; }\n  input, textarea, select, button { font-family: inherit; }\n  input[type=range] { accent-color: #8A6410; }\n  @media print { [data-chrome] { display: none !important; } }\n<\u002Fstyle>\n<script src=\"c4371d73-9818-47e6-bf4f-c43cd0369565\"><\u002Fscript>\n<script src=\"ee8246dc-9931-466f-a7df-1798a2202700\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div data-screen-label=\"Portada\" style=\"background:#16306B;padding:30px 0 32px\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px\">\n      <img src=\"5b54f2f6-23a3-471a-9e24-1861b3b7f4ca\" alt=\"IEFPI\" style=\"height:44px;width:auto;display:block\">\n      <div>\n        <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#E0A52E;line-height:1.1\">IEFPI · Diplomado 020-26 · Módulo IV<\u002Fdiv>\n        <div style=\"font-size:11.5px;font-weight:600;color:rgba(255,255,255,.7);margin-top:3px\">Unidad 2 · Tema 3 de 4 — Recurso asíncrono para el RA 9.4<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:inline-flex;align-items:center;gap:8px;background:#E0A52E;border-radius:100px;padding:5px 14px;margin-bottom:14px\">\n      <span style=\"font-size:13px;color:#16306B\">★<\u002Fspan>\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#16306B\">Matiz · ejecución máxima · ruta aparte<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-size:clamp(25px,3.2vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.1;color:#FFFFFF;margin:0 0 12px;max-width:34ch\">Índices clásicos del reactivo<\u002Fh1>\n    <p style=\"font-size:15px;line-height:1.62;color:rgba(255,255,255,.78);max-width:76ch;margin:0 0 14px;text-wrap:pretty\">Corrija una celda de la clave y vea tres índices cambiar de signo. Ubique los ocho reactivos del Caso M frente a su techo de discriminación, mida cuánto de D depende de la regla de desempate y calcule qué tan fácil es que un buen distractor parezca muerto con treinta sustentantes.<\u002Fp>\n    <div style=\"background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:12px 16px;max-width:74ch;margin-bottom:16px;font-size:13.5px;line-height:1.55;color:#FFFFFF;text-wrap:pretty\">Este tema se resuelve sólo si su instrumento es un examen de rendimiento. Quien construye una escala o una encuesta pasa directamente al Tema 4: saltarlo no rompe la secuencia.<\u002Fdiv>\n    <div style=\"background:rgba(224,165,46,.16);border:1px solid rgba(224,165,46,.5);border-radius:12px;padding:15px 18px;max-width:74ch;margin-bottom:20px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#E0A52E;margin-bottom:7px\">Lo que resume el tema<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:700;color:#FFFFFF;line-height:1.4;text-wrap:pretty\">Un D bajo no es un defecto; es un dato que hay que dividir por su techo. M4 entregó el 100 % de lo que podía entregar; M6 entregó el 25 %.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n      <a href=\"#t3r1\" style=\"font-size:12.5px;font-weight:700;color:#16306B;background:#FFFFFF;padding:9px 16px;border-radius:100px\" style-hover=\"background:#EAF0FA\">3.1 La clave de M3<\u002Fa>\n      <a href=\"#t3r2\" style=\"font-size:12.5px;font-weight:700;color:#FFFFFF;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);padding:9px 16px;border-radius:100px\" style-hover=\"background:rgba(255,255,255,.2)\">3.2 Dificultad y discriminación<\u002Fa>\n      <a href=\"#t3r3\" style=\"font-size:12.5px;font-weight:700;color:#FFFFFF;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);padding:9px 16px;border-radius:100px\" style-hover=\"background:rgba(255,255,255,.2)\">3.3 Tres reglas de desempate<\u002Fa>\n      <a href=\"#t3r4\" style=\"font-size:12.5px;font-weight:700;color:#FFFFFF;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);padding:9px 16px;border-radius:100px\" style-hover=\"background:rgba(255,255,255,.2)\">3.4 Distractores con n = 30<\u002Fa>\n      <a href=\"#t3r5\" style=\"font-size:12.5px;font-weight:700;color:#FFFFFF;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);padding:9px 16px;border-radius:100px\" style-hover=\"background:rgba(255,255,255,.2)\">3.5 Seis fichas<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<section id=\"t3r1\" data-screen-label=\"3.1 La clave de M3\" style=\"padding:48px 0 0;background:#FFFFFF\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px\">\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#1C4C96\">Recurso central · Caso M resuelto · discriminación negativa<\u002Fspan>\n      <span style=\"font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#16306B;background:#DCE6F7;border-radius:100px;padding:2px 9px\">Archivo trampa<\u002Fspan>\n      <span style=\"height:1px;flex:1;background:#E4E2DC\"><\u002Fspan>\n      <span style=\"font-size:11px;font-weight:700;color:#84838C;letter-spacing:.06em\">★ RA 9.4<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(23px,2.9vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 12px;max-width:42ch\">3.1 · Una celda de la clave, tres índices que cambian de signo<\u002Fh2>\n    <p style=\"font-size:15.5px;line-height:1.65;color:#45454F;max-width:78ch;margin:0 0 16px;text-wrap:pretty\">Es la base del Caso M con la clave tal como se capturó. Encuentre el reactivo con discriminación negativa, revise su clave contra la fuente —abajo está el enunciado— y corríjala. Todos los índices se recalculan: también los de los demás reactivos, porque cambia el puntaje total.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px\">\n      <span style=\"font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#84838C;margin-right:4px\">Clave<\u002Fspan>\n      <sc-for list=\"{{ keys }}\" as=\"k\" hint-placeholder-count=\"8\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid {{ k.br }};border-radius:10px;padding:5px 6px;background:{{ k.bg }}\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:800;color:#5A5A64\">{{ k.k }}<\u002Fspan>\n          <div style=\"display:flex;gap:2px\"><sc-for list=\"{{ k.ops }}\" as=\"o\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ o.pick }}\" style=\"width:30px;height:32px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:800;color:{{ o.col }};background:{{ o.bg }};border:1px solid {{ o.br }};border-radius:6px;cursor:pointer;padding:0\">{{ o.l }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <button sc-camel-on-click=\"{{ resetKey }}\" style=\"font-size:12px;font-weight:700;color:#8A211A;background:transparent;border:1px solid rgba(179,38,30,.3);padding:8px 12px;border-radius:100px;cursor:pointer;min-height:40px;margin-left:6px\">Clave capturada<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"overflow-x:auto;border:1px solid #E4E2DC;border-radius:14px\">\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:820px\">\n        <sc-raw-thead><sc-raw-tr style=\"background:#16306B\"><sc-for list=\"{{ iHead }}\" as=\"h\" hint-placeholder-count=\"10\"><sc-raw-th style=\"text-align:{{ h.al }};padding:9px 10px;font-size:11px;font-weight:800;color:#FFFFFF\">{{ h.t }}<\u002Fsc-raw-th><\u002Fsc-for><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody><sc-for list=\"{{ iRows }}\" as=\"r\" hint-placeholder-count=\"8\"><sc-raw-tr style=\"background:{{ r.bg }}\"><sc-for list=\"{{ r.c }}\" as=\"c\" hint-placeholder-count=\"10\"><sc-raw-td style=\"padding:8px 10px;text-align:{{ c.al }};font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:{{ c.fw }};color:{{ c.col }};border-top:1px solid #EFEDE7\">{{ c.t }}<\u002Fsc-raw-td><\u002Fsc-for><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <div style=\"margin-top:12px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start\">\n      <div style=\"flex:1 1 360px;min-width:0;background:#F5F4F0;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#45454F\">Reactivo M3<\u002Fspan>\n        <span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:15.5px;line-height:1.5\">«¿Qué apartado de la norma ISO 9001:2015 establece los requisitos de la auditoría interna?»   A) 9.1.3 · B) 9.2 · C) 10.2<\u002Fspan>\n        <span style=\"font-size:12.5px;color:#5A5A64;line-height:1.5\">Revise la clave contra la norma, no contra su memoria.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 360px;min-width:0;border:1px solid {{ m3.br }};background:{{ m3.bg }};border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:{{ m3.c }}\">{{ m3.tag }}<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:#1A1A22\">{{ m3.nums }}<\u002Fspan>\n        <span style=\"font-size:13.5px;line-height:1.55;color:#1A1A22;text-wrap:pretty\">{{ m3.t }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:12px;overflow-x:auto;border:1px solid #E4E2DC;border-radius:14px\">\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:640px\">\n        <sc-raw-thead><sc-raw-tr style=\"background:#F5F4F0\"><sc-raw-th style=\"text-align:left;padding:8px 10px;font-size:11px;font-weight:800;color:#45454F\">Distractores · total (sup/inf)<\u002Fsc-raw-th><sc-raw-th style=\"text-align:center;padding:8px 10px;font-size:11px;font-weight:800;color:#45454F\">A<\u002Fsc-raw-th><sc-raw-th style=\"text-align:center;padding:8px 10px;font-size:11px;font-weight:800;color:#45454F\">B<\u002Fsc-raw-th><sc-raw-th style=\"text-align:center;padding:8px 10px;font-size:11px;font-weight:800;color:#45454F\">C<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody><sc-for list=\"{{ dRows }}\" as=\"r\" hint-placeholder-count=\"8\"><sc-raw-tr><sc-raw-td style=\"padding:7px 10px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:800;border-top:1px solid #EFEDE7\">{{ r.k }}<\u002Fsc-raw-td><sc-for list=\"{{ r.o }}\" as=\"o\" hint-placeholder-count=\"3\"><sc-raw-td style=\"padding:7px 10px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:{{ o.fw }};color:{{ o.col }};background:{{ o.bg }};border-top:1px solid #EFEDE7\">{{ o.t }}<\u002Fsc-raw-td><\u002Fsc-for><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px\">\n      <button sc-camel-on-click=\"{{ dlM }}\" style=\"font-size:13px;font-weight:700;color:#FFFFFF;background:#16306B;border:0;padding:11px 18px;border-radius:100px;cursor:pointer;min-height:44px\">Descargar la base del Caso M (.xlsx, D por COUNTIFS)<\u002Fbutton>\n      <span style=\"font-size:12px;color:#84838C;line-height:1.5;max-width:70ch\">Clave en negritas. Grupos del 27 % (8 y 8), desempate por folio ascendente. Matriz reconstruida para el recurso: reproduce la tabla de índices y la de distractores del manual.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-top:12px;background:#FDF6E7;border:1px solid rgba(224,165,46,.55);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#8A6410\">Procedimiento ante un D o una r_pb negativos<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.6;color:#4A3608;text-wrap:pretty\">Revise la clave contra la fuente. Mire la tabla de distractores por grupo: si el grupo superior se concentró en una opción, esa opción es la sospechosa. Pida a un experto independiente que juzgue si es defendible. Recalifique en una columna nueva y registre el antes y el después de p, D y r_pb. No elimine el reactivo.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"t3r2\" data-screen-label=\"3.2 Diagrama dificultad-discriminacion\" style=\"padding:56px 0 0;background:#FFFFFF\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px\">\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#1C4C96\">Segundo recurso · la relación entre p y D · M4 frente a M6<\u002Fspan>\n      <span style=\"font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#16306B;background:#DCE6F7;border-radius:100px;padding:2px 9px\">Capa conceptual<\u002Fspan>\n      <span style=\"height:1px;flex:1;background:#E4E2DC\"><\u002Fspan>\n      <span style=\"font-size:11px;font-weight:700;color:#84838C;letter-spacing:.06em\">★ RA 9.4<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(23px,2.9vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 12px;max-width:42ch\">3.2 · El diagrama dificultad-discriminación<\u002Fh2>\n    <p style=\"font-size:15.5px;line-height:1.65;color:#45454F;max-width:78ch;margin:0 0 16px;text-wrap:pretty\">Cada punto es un reactivo del Caso M con la clave de 3.1. La línea dorada es D_máx, el techo aritmético con grupos de 8. Toque un punto para leer su ficha. Mire dónde quedan M4 y M6.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n      <div style=\"flex:1.4 1 460px;min-width:0;border:1px solid #E4E2DC;border-radius:16px;padding:10px\">\n        <div style=\"display:flex;gap:6px;margin:4px 4px 8px\"><sc-for list=\"{{ yOps }}\" as=\"o\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ o.pick }}\" style=\"font-size:12.5px;font-weight:700;color:{{ o.col }};background:{{ o.bg }};border:1px solid {{ o.br }};padding:7px 12px;border-radius:100px;cursor:pointer;min-height:40px\">{{ o.t }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <svg sc-camel-view-box=\"0 0 560 400\" style=\"width:100%;height:auto;display:block;font-family:Inter,sans-serif\">\n          <rect x=\"60\" y=\"20\" width=\"480\" height=\"320\" fill=\"#FAF9F5\"><\u002Frect>\n          <sc-for list=\"{{ gridY }}\" as=\"g\" hint-placeholder-count=\"5\"><line x1=\"60\" x2=\"540\" y1=\"{{ g.y }}\" y2=\"{{ g.y }}\" stroke=\"{{ g.c }}\" stroke-width=\"{{ g.w }}\"><\u002Fline><text x=\"52\" y=\"{{ g.ty }}\" text-anchor=\"end\" font-size=\"11\" fill=\"#5A5A64\">{{ g.l }}<\u002Ftext><\u002Fsc-for>\n          <sc-for list=\"{{ gridX }}\" as=\"g\" hint-placeholder-count=\"6\"><line x1=\"{{ g.x }}\" x2=\"{{ g.x }}\" y1=\"20\" y2=\"340\" stroke=\"#E4E2DC\"><\u002Fline><text x=\"{{ g.x }}\" y=\"358\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5A5A64\">{{ g.l }}<\u002Ftext><\u002Fsc-for>\n          <line x1=\"{{ azar }}\" x2=\"{{ azar }}\" y1=\"20\" y2=\"340\" stroke=\"#8A211A\" stroke-dasharray=\"4 4\"><\u002Fline>\n          <text x=\"{{ azarT }}\" y=\"34\" font-size=\"10.5\" fill=\"#8A211A\">azar .333<\u002Ftext>\n          <path d=\"{{ curve }}\" fill=\"none\" stroke=\"#E0A52E\" stroke-width=\"3\"><\u002Fpath>\n          <text x=\"300\" y=\"34\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#8A6410\">{{ curveLbl }}<\u002Ftext>\n          <sc-for list=\"{{ pts }}\" as=\"p\" hint-placeholder-count=\"8\"><g sc-camel-on-click=\"{{ p.pick }}\" style=\"cursor:pointer\"><circle cx=\"{{ p.x }}\" cy=\"{{ p.y }}\" r=\"{{ p.r }}\" fill=\"{{ p.c }}\" stroke=\"#FFFFFF\" stroke-width=\"2\"><\u002Fcircle><text x=\"{{ p.tx }}\" y=\"{{ p.ty }}\" font-size=\"12\" font-weight=\"800\" fill=\"{{ p.tc }}\">{{ p.k }}<\u002Ftext><\u002Fg><\u002Fsc-for>\n          <text x=\"300\" y=\"390\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1A1A22\">p · índice de dificultad (proporción de aciertos)<\u002Ftext>\n          <text x=\"16\" y=\"180\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1A1A22\" transform=\"rotate(-90 16 180)\">{{ yLbl }}<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"border:1.5px solid #16306B;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:900;color:#16306B\">{{ sel.k }}<\u002Fspan>\n          <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px\"><sc-for list=\"{{ sel.st }}\" as=\"s\" hint-placeholder-count=\"4\"><div style=\"background:#F5F4F0;border-radius:8px;padding:6px 8px;display:flex;flex-direction:column\"><span style=\"font-size:10px;font-weight:800;color:#84838C\">{{ s.l }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700\">{{ s.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n          <span style=\"font-size:13px;font-weight:800;color:#8A6410\">{{ sel.ratio }}<\u002Fspan>\n          <span style=\"font-size:13.5px;line-height:1.55;color:#1A1A22;text-wrap:pretty\">{{ sel.t }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#ECF1FA;border:1px solid rgba(28,76,150,.25);border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.55;color:#1A1A22;text-wrap:pretty\">D_máx = min{1, min(p, 1 − p) / 0.2667}. Si sólo fallan 3 de 30, lo más discriminante posible es que los 3 estén en el grupo inferior: D = 3/8 = .375.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:12px;background:#FDF6E7;border:1px solid rgba(224,165,46,.55);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#8A6410\">La pregunta previa a cualquier umbral de dificultad<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.6;color:#4A3608;text-wrap:pretty\">¿Su examen está referido a norma o a criterio? En un examen de certificación referido a criterio, un p de .97 en contenido que todos deben dominar es el resultado esperado; eliminar M4 por «no discriminar» sería eliminar la evidencia de que el dominio se alcanzó. Escriba la respuesta en la bitácora antes de interpretar las dificultades.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"t3r3\" data-screen-label=\"3.3 Tres reglas de desempate\" style=\"padding:56px 0 0;background:#FFFFFF\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px\">\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#1C4C96\">Tercer recurso · cuánto de D depende de la regla de desempate<\u002Fspan>\n      <span style=\"font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#16306B;background:#DCE6F7;border-radius:100px;padding:2px 9px\">Capa conceptual<\u002Fspan>\n      <span style=\"height:1px;flex:1;background:#E4E2DC\"><\u002Fspan>\n      <span style=\"font-size:11px;font-weight:700;color:#84838C;letter-spacing:.06em\">★ RA 9.4<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(23px,2.9vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 12px;max-width:42ch\">3.3 · La misma matriz, tres reglas de desempate, tres valores de D para M3<\u002Fh2>\n    <p style=\"font-size:15.5px;line-height:1.65;color:#45454F;max-width:78ch;margin:0 0 16px;text-wrap:pretty\">Los treinta sustentantes, ordenados por puntaje total con la clave capturada. Dieciséis empatan en 6 puntos para siete plazas del grupo superior: quién entra lo decide la regla. Reproduzca los tres fotogramas y mire cambiar el D de M3 mientras su r_pb no se mueve.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px\">\n      <button sc-camel-on-click=\"{{ play }}\" style=\"font-size:13px;font-weight:700;color:#FFFFFF;background:#16306B;border:0;padding:10px 16px;border-radius:100px;cursor:pointer;min-height:44px\">{{ playLbl }}<\u002Fbutton>\n      <sc-for list=\"{{ frames }}\" as=\"f\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ f.pick }}\" style=\"font-size:12.5px;font-weight:700;color:{{ f.col }};background:{{ f.bg }};border:1px solid {{ f.br }};padding:9px 14px;border-radius:100px;cursor:pointer;min-height:44px\">{{ f.t }}<\u002Fbutton><\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n      <div style=\"flex:1.5 1 520px;min-width:0;display:flex;flex-direction:column;gap:6px\">\n        <sc-for list=\"{{ bands }}\" as=\"b\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:800;color:#45454F\">{{ b.l }}<\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;gap:4px\"><sc-for list=\"{{ b.ps }}\" as=\"p\" hint-placeholder-count=\"6\"><span style=\"display:flex;flex-direction:column;align-items:center;min-width:42px;padding:4px 4px;border-radius:8px;background:{{ p.bg }};border:1.5px solid {{ p.br }};transition:background .35s ease, border-color .35s ease\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;color:{{ p.tc }}\">{{ p.f }}<\u002Fspan><span style=\"font-size:12px;font-weight:900;color:{{ p.mc }}\">{{ p.m }}<\u002Fspan><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:12px;color:#45454F\"><span><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:#16306B;vertical-align:-2px\"><\u002Fspan> grupo superior<\u002Fspan><span><span style=\"display:inline-block;width:12px;height:12px;border-radius:3px;background:#E0A52E;vertical-align:-2px\"><\u002Fspan> grupo inferior<\u002Fspan><span>✓ / ✗ = acierto en M3 con la clave capturada<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"border:1.5px solid #16306B;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#84838C\">{{ fr.t }}<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.5;color:#45454F\">{{ fr.d }}<\u002Fspan>\n          <div style=\"display:flex;align-items:baseline;gap:10px;margin-top:4px\"><span style=\"font-size:12px;font-weight:800;color:#45454F\">D de M3<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:900;color:{{ fr.c }}\">{{ fr.D }}<\u002Fspan><\u002Fdiv>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#45454F\">{{ fr.ps }}<\u002Fspan>\n          <div style=\"display:flex;align-items:baseline;gap:10px;border-top:1px solid #E4E2DC;padding-top:8px\"><span style=\"font-size:12px;font-weight:800;color:#45454F\">r_pb de M3<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:900;color:#16306B\">{{ fr.r }}<\u002Fspan><span style=\"font-size:12px;color:#146B52;font-weight:700\">invariante<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"overflow-x:auto;border:1px solid #E4E2DC;border-radius:12px\">\n          <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:280px\">\n            <sc-raw-thead><sc-raw-tr style=\"background:#F5F4F0\"><sc-raw-th style=\"text-align:left;padding:7px 9px;font-size:11px;font-weight:800;color:#45454F\">React.<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;padding:7px 9px;font-size:11px;font-weight:800;color:#45454F\">D en los 3 fotogramas<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;padding:7px 9px;font-size:11px;font-weight:800;color:#45454F\">r_pb<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody><sc-for list=\"{{ sens }}\" as=\"s\" hint-placeholder-count=\"8\"><sc-raw-tr style=\"background:{{ s.bg }}\"><sc-raw-td style=\"padding:6px 9px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:800;border-top:1px solid #EFEDE7\">{{ s.k }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;border-top:1px solid #EFEDE7\">{{ s.d }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;border-top:1px solid #EFEDE7\">{{ s.r }}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;color:#84838C;line-height:1.5;margin-top:10px;text-wrap:pretty\">El manual recalculó D bajo tres mil reglas de desempate al azar: para M3 va de −.625 a +.250 y para M6 de −.125 a +.625. El tercer fotograma es una de esas reglas. Confirmar: con las tablas del manual el puntaje total toma cinco valores distintos, no seis.<\u002Fdiv>\n    <div style=\"margin-top:12px;background:#ECF1FA;border:1px solid rgba(28,76,150,.25);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#1C4C96\">Regla del diplomado<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.6;color:#1A1A22;text-wrap:pretty\">Reporte los dos índices, use r_pb para decidir y declare su regla de desempate antes de calcular D. D usa 16 de los 30 casos y se mueve en pasos de .125; r_pb usa los 30 y no forma grupos. Si no declara la regla, su D no es reproducible.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"t3r4\" data-screen-label=\"3.4 Distractores con n = 30\" style=\"padding:56px 0 0;background:#FFFFFF\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px\">\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#1C4C96\">Cuarto recurso · ¿se puede hacer análisis de distractores con treinta sustentantes?<\u002Fspan>\n      <span style=\"font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#16306B;background:#DCE6F7;border-radius:100px;padding:2px 9px\">Capa conceptual<\u002Fspan>\n      <span style=\"height:1px;flex:1;background:#E4E2DC\"><\u002Fspan>\n      <span style=\"font-size:11px;font-weight:700;color:#84838C;letter-spacing:.06em\">★ RA 9.4<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(23px,2.9vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 12px;max-width:42ch\">3.4 · Simulador: ¿qué tan fácil es que un buen distractor parezca muerto?<\u002Fh2>\n    <p style=\"font-size:15.5px;line-height:1.65;color:#45454F;max-width:78ch;margin:0 0 16px;text-wrap:pretty\">Fije la tasa real con que la población elige un distractor y el tamaño del pilotaje. El simulador da la probabilidad de observar cero o una elección, que con n = 30 es lo que significa «menos del 5 %».<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start\">\n      <div style=\"flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:12px;border:1px solid #E4E2DC;border-radius:16px;padding:16px\">\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700\">Tasa real de elección del distractor = <span style=\"font-family:'JetBrains Mono',monospace;font-size:22px;color:#8A6410\">{{ dTasaT }}<\u002Fspan><input type=\"range\" min=\"1\" max=\"30\" value=\"{{ dTasa }}\" sc-camel-on-input=\"{{ setTasa }}\" style=\"width:100%;min-height:36px\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700\">Sustentantes = <span style=\"font-family:'JetBrains Mono',monospace;font-size:22px;color:#8A6410\">{{ dN }}<\u002Fspan><input type=\"range\" min=\"30\" max=\"300\" step=\"10\" value=\"{{ dN }}\" sc-camel-on-input=\"{{ setDN }}\" style=\"width:100%;min-height:36px\"><\u002Flabel>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ dPre }}\" as=\"p\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ p.pick }}\" style=\"font-size:12px;font-weight:700;color:#16306B;background:#FFFFFF;border:1px solid #C9C7C0;padding:7px 11px;border-radius:100px;cursor:pointer;min-height:40px\">{{ p.t }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1.3 1 420px;min-width:0;display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ dOut }}\" as=\"o\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-size:13.5px;font-weight:700;flex:1\">{{ o.l }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:900;color:{{ o.c }}\">{{ o.v }}<\u002Fspan><\u002Fdiv>\n            <div style=\"height:14px;background:#EFEDE7;border-radius:7px;overflow:hidden\"><div style=\"height:100%;width:{{ o.w }};background:{{ o.c }};border-radius:7px;transition:width .25s ease\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"background:#14182A;border-radius:12px;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E6E9F2;white-space:pre-wrap;overflow-wrap:anywhere\">{{ dSteps }}<\u002Fdiv>\n        <div style=\"font-size:14px;font-weight:700;line-height:1.5;color:#1A1A22;text-wrap:pretty\">{{ dVer }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:12px;background:#FDF6E7;border:1px solid rgba(224,165,46,.55);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#8A6410\">Qué se afirma y qué no sobre distractores<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.6;color:#4A3608;text-wrap:pretty\">Sí se afirma, con fuerza: que un distractor fue elegido por la mayoría del grupo superior (M3 y M5, opción B). Se registra como hipótesis: que una opción con cero o una elección «no funciona». No se afirma nunca: que un distractor «no funcional» deba eliminarse con base en el pilotaje.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"t3r5\" data-screen-label=\"3.5 Seis fichas\" style=\"padding:56px 0 64px;background:#FFFFFF\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px\">\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#1C4C96\">Evaluación formativa · lectura conjunta de p y D<\u002Fspan>\n      <span style=\"font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#16306B;background:#DCE6F7;border-radius:100px;padding:2px 9px\">Capa conceptual<\u002Fspan>\n      <span style=\"height:1px;flex:1;background:#E4E2DC\"><\u002Fspan>\n      <span style=\"font-size:11px;font-weight:700;color:#84838C;letter-spacing:.06em\">★ RA 9.4<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(23px,2.9vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0 0 12px;max-width:42ch\">3.5 · Seis fichas, seis diagnósticos<\u002Fh2>\n    <p style=\"font-size:15.5px;line-height:1.65;color:#45454F;max-width:78ch;margin:0 0 16px;text-wrap:pretty\">Empareje cada ficha con su diagnóstico. Cada diagnóstico se usa una vez. Las bandas de Ebel no alcanzan: dos de las fichas tienen el D más bajo del examen y problemas opuestos.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px\">\n      <sc-for list=\"{{ mf }}\" as=\"f\" hint-placeholder-count=\"6\">\n        <div style=\"border:1.5px solid {{ f.br }};border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:#FFFFFF\">\n          <span style=\"font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#84838C\">{{ f.n }}<\u002Fspan>\n          <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px\"><sc-for list=\"{{ f.st }}\" as=\"s\" hint-placeholder-count=\"4\"><div style=\"background:#F5F4F0;border-radius:8px;padding:5px 7px;display:flex;flex-direction:column\"><span style=\"font-size:10px;font-weight:800;color:#84838C\">{{ s.l }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:700\">{{ s.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n          <sc-raw-select value=\"{{ f.sel }}\" sc-camel-on-change=\"{{ f.set }}\" style=\"font-size:12.5px;font-weight:700;padding:9px 10px;border:1px solid #C9C7C0;border-radius:10px;background:#FFFBEF;min-height:44px;color:#1A1A22;width:100%\">\n            <option value=\"\">Elija el diagnóstico…<\u002Foption>\n            <sc-for list=\"{{ diags }}\" as=\"d\" hint-placeholder-count=\"6\"><option value=\"{{ d.v }}\">{{ d.t }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <sc-if value=\"{{ f.show }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12.5px;line-height:1.5;background:{{ f.fbBg }};border-radius:8px;padding:8px 10px;text-wrap:pretty\"><strong style=\"color:{{ f.fbCol }}\">{{ f.tag }}<\u002Fstrong> {{ f.why }}<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:12px\">\n      <button sc-camel-on-click=\"{{ mCheck }}\" style=\"font-size:13px;font-weight:700;color:#FFFFFF;background:#16306B;border:0;padding:11px 18px;border-radius:100px;cursor:pointer;min-height:44px\">Revisar<\u002Fbutton>\n      <span style=\"font-size:14px;font-weight:800;color:#16306B\">{{ mScore }}<\u002Fspan>\n      <span style=\"flex:1\"><\u002Fspan>\n      <button sc-camel-on-click=\"{{ mReset }}\" style=\"font-size:12px;font-weight:700;color:#8A211A;background:transparent;border:1px solid rgba(179,38,30,.3);padding:8px 13px;border-radius:100px;cursor:pointer;min-height:40px\">Reiniciar<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"margin-top:12px;background:#FDECEA;border:1px solid rgba(179,38,30,.3);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#8A211A\">Errores frecuentes del Tema 3<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.6;color:#3D1410;text-wrap:pretty\">Descartar un reactivo con p = .97 en un examen referido a criterio. Leer la diferencia entre D = .250 y D = .375 como diferencia de calidad, cuando es una persona. Eliminar un reactivo con D negativo sin revisar la clave. Reportar D sin el porcentaje de los grupos extremos ni la regla de desempate.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer data-chrome=\"1\" style=\"background:#16306B;padding:26px 0\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 clamp(20px,4vw,40px);display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n    <span style=\"font-size:12px;font-weight:700;color:rgba(255,255,255,.8)\">IEFPI · Diplomado 020-26 · Módulo IV · Unidad 2 · Tema 3 ★<\u002Fspan>\n    <span style=\"flex:1\"><\u002Fspan>\n    <span style=\"font-size:11.5px;color:rgba(255,255,255,.6)\">Fuentes: Kelley (1939); Ebel y Frisbie (1986); Lord (1952); ScorePak, Universidad de Washington<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst KEY = 'iefpi-m4u2-t3';\nconst TXT = {\n  M1: 'Fácil. D está en su techo aritmético: con 3 errores de 30, .375 es lo máximo posible. La opción C no la eligió nadie: hipótesis, no hallazgo.',\n  M2: 'Óptimo. Dificultad media y separación completa; los dos distractores funcionan y discriminan.',\n  M3: 'Discriminación negativa. El grupo superior se concentró en B, que no es la clave capturada. Revise la clave contra la norma.',\n  M4: 'D está en su techo (.125). No hay nada que arreglar en su redacción: con 29 aciertos ningún reparto de errores da más. Decisión de contenido: ¿norma o criterio?',\n  M5: 'p por debajo del azar (.333) y r_pb negativa. La opción B atrae a 5 de los 8 mejores: hipótesis terminológica («registros» de 2008 frente a «información documentada» de 2015). Se verifica en la entrevista cognitiva.',\n  M6: 'Problema real de discriminación. Podía llegar a D = 1.000 y entregó .250, con r_pb ligeramente negativa. Los distractores atraen por igual a los dos grupos. Candidato a revisar redacción y distractores.',\n  M7: 'Funciona. Ambos distractores discriminan.',\n  M8: 'Funciona, cerca de su techo (.750 de .875). Ambos distractores discriminan.'\n};\nconst DIAG = [['techo', 'D en su techo: no puede discriminar más; decidir norma o criterio'], ['opt', 'Dificultad media y separación completa: funciona'], ['clave', 'Discriminación negativa con p medio: revisar la clave'], ['azar', 'Acierto por debajo del azar: un distractor atrae también a los mejores'], ['real', 'Podía discriminar y no lo hace: revisar redacción y distractores'], ['facil', 'Moderadamente fácil y discrimina cerca de su techo']];\nconst MF = [['M4', 'techo'], ['M6', 'real'], ['M2', 'opt'], ['M5', 'azar'], ['M8', 'facil'], ['M3', 'clave']];\nconst RULES = [['asc', 'Fotograma 1 · folio ascendente', 'La regla declarada en el manual: entre empatados entra primero el folio menor.'], ['desc', 'Fotograma 2 · folio descendente', 'La misma matriz; entre empatados entra primero el folio mayor.'], ['sorteo', 'Fotograma 3 · sorteo', 'La misma matriz; los empatados se ordenan por un sorteo con semilla fija.']];\nconst f3 = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(3);\nconst fp = (v) => v.toFixed(3).replace(/^0/, '').replace(/^1\\.000$/, '1.000');\nfunction load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }\n\nclass Component extends DCLogic {\n  constructor(p)
